# ABOUTME: Bug report form for public issues. Steers licence-lockout reports toward the
# ABOUTME: details that actually diagnose them: host, mode, and what validate returned.
name: Bug report
description: Something isn't working the way the docs say it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a security problem, please don't file it here,
        see [SECURITY.md](https://github.com/GoldenBerry-SO/coolbeans/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Where are you running it?
      options:
        - Self-host (docker compose)
        - Self-host (other)
        - Cloud (app.coolbeans.tools)
        - SDK only (my app)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, curl commands, or a failing test. The server's JSON response verbatim helps a lot.
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Anything relevant from the server log or SDK. Never paste a real licence key or admin token.
      render: shell
