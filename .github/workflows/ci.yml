# ABOUTME: CI (PRD §20) — lint, typecheck, test on every push/PR, plus the compose smoke test.
# ABOUTME: The smoke job proves the self-host promise on each change, not just in docs.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose smoke test
        env:
          ADMIN_TOKEN: ci-admin-token-0123456789
          SIGNING_KEY_SECRET: ci-signing-secret-0123456789
        run: bash scripts/smoke-test.sh
