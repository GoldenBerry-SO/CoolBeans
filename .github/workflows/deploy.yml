# ABOUTME: Cloud deploy (PRD §18) — build one image to GHCR and roll out via GitOps to k8s.
# ABOUTME: The api, worker, and migrate Job all run this image with different commands.

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # metadata-action is NOT cosmetic: its labels output carries the OCI source
      # annotation that auto-links the GHCR package to this repo. Without the link the
      # org's inherit-access default never applies, the package stays private, and the
      # k3s node's pull fails with a 404 that looks like a missing tag. Packages are
      # sticky — pushing once without labels means deleting the package to recover.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/goldenberry-so/coolbeans
          tags: |
            # prefix= strips metadata-action's default sha- so the tag equals the bare
            # github.sha the rollout job pins. Dropping this once shipped tags nothing
            # else could name, and every pod sat in ImagePullBackOff on 'not found'.
            type=sha,format=long,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  rollout:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: GoldenBerry-SO/infra
          token: ${{ secrets.INFRA_DEPLOY_TOKEN }}
      - uses: imranismail/setup-kustomize@v2
      - name: Bump image tag (GitOps)
        run: |
          cd k8s/apps/coolbeans
          kustomize edit set image \
            coolbeans=ghcr.io/goldenberry-so/coolbeans:${{ github.sha }}
          git config user.name "coolbeans-ci"
          git config user.email "ci@coolbeans.tools"
          git add kustomization.yaml
          git diff --cached --quiet && echo "No image change" && exit 0
          git commit -m "coolbeans: deploy ${{ github.sha }}"
          git push
