# ABOUTME: Cloud deploy (PRD §18) — build images to GHCR and roll out via GitOps to k8s.
# ABOUTME: Mirrors pleasehold's pipeline: build+push by sha, then bump the infra repo's image tag.

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ghcr.io/goldenberry-so/coolbeans-api:${{ github.sha }}
      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ghcr.io/goldenberry-so/coolbeans-worker:${{ github.sha }}

  rollout:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: GoldenBerry-SO/infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
      - name: Bump image tags (GitOps)
        run: |
          cd apps/coolbeans
          kustomize edit set image \
            coolbeans-api=ghcr.io/goldenberry-so/coolbeans-api:${{ github.sha }} \
            coolbeans-worker=ghcr.io/goldenberry-so/coolbeans-worker:${{ github.sha }}
          git config user.name "coolbeans-ci"
          git config user.email "ci@coolbeans.tools"
          git commit -am "coolbeans: deploy ${{ github.sha }}"
          git push
