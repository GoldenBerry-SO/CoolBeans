# ABOUTME: Publishes @coolbeans/sdk and @coolbeans/cli to npm when a v* tag is pushed.
# ABOUTME: Tests gate the publish, and npm provenance ties each tarball to this workflow run.
#
# One-time prerequisites (not automated on purpose):
#   1. Create the npm org `coolbeans` (free for public packages).
#   2. Create an npm Automation token with publish rights on @coolbeans/*.
#   3. Add it as the repo secret NPM_TOKEN.
#
# To release:
#   Bump the version in packages/sdk/package.json and packages/cli/package.json,
#   merge that, then `git tag v0.1.0 && git push --tags`.
#
# The tag is what triggers this. Nothing publishes on a normal merge to main.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only, do not publish'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: npm exchanges this for a signed attestation
      # linking the published tarball to this workflow and commit.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # The publish is gated on the same checks main is. A broken SDK on npm is
      # far more expensive to walk back than a failed release run.
      - name: Lint and typecheck
        run: pnpm run check

      - name: Test
        run: pnpm test

      - name: Build the publishable packages
        run: pnpm --filter @coolbeans/sdk --filter @coolbeans/cli build

      # Catches the mistakes that only show up at pack time: a missing LICENSE, an
      # empty dist, files that were meant to ship and did not.
      - name: Show what would ship
        run: |
          for p in sdk cli; do
            echo "--- @coolbeans/$p"
            ( cd "packages/$p" && npm pack --dry-run )
          done

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in sdk cli; do
            VER=$(node -p "require('./packages/$p/package.json').version")
            if [ "$VER" != "$TAG" ]; then
              echo "::error::tag v$TAG does not match @coolbeans/$p version $VER"
              exit 1
            fi
          done
          echo "tag and package versions agree: $TAG"

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        run: |
          pnpm --filter @coolbeans/sdk publish --access public --provenance --no-git-checks
          pnpm --filter @coolbeans/cli publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
